<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Chronicles Lite</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chronicles"><meta name="theme-color" content="#0b0e22"><link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: command-console shell — sticky top bar with class tabs, boss banner, then a sub-nav over one working panel (board, import, roster, log). */
/* Game skin: the console is always a dark, night-at-the-outpost HUD (same tokens in light and dark). */
:root{
  --bg:#070B1A; --surface:#121a36; --sunk:#0c1229; --ink:#EAF0FF; --muted:#9AA6C8; --line:#26325c;
  --navy:#0B1130; --navy-ink:#FFFFFF; --cy:#3DE0FF; --mag:#FF3DCB;
  --gold:#FFC24A; --gold-soft:#3A2E17;
  --boss:#FF3D6E; --boss-soft:#3D1426; --boss-track:#2a1530;
  --medic:#4ADE80; --medic-soft:#12301f;
  --soldier:#FF6363; --soldier-soft:#3a1717;
  --engineer:#4FB3FF; --engineer-soft:#10294a;
  --ok:#4ADE80; --warn:#FFB347;
  --shadow:0 0 0 1px rgba(61,224,255,.06),0 12px 30px rgba(0,0,0,.45);
  color-scheme:dark;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;color:inherit;padding:7px 14px;border-radius:7px;font-family:var(--f-display);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:#fff;color:#1E2A4A}
.tab small{font-family:var(--f-num);font-size:11px;opacity:.7}
.ghost-btn{border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;border-radius:8px;padding:7px 12px;font-size:13px}
.ghost-btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1E2A4A;font-weight:700}

main{padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.warn{border-color:var(--warn);background:var(--gold-soft)}
.notice b{font-weight:700}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:2px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Boss */
.boss{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.boss-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:16px 18px 10px}
.boss-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--boss);font-weight:700}
.boss-name{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.03em;margin-top:4px}
.boss-sub{color:var(--muted);font-size:13px;margin-top:4px}
.boss-hp{margin-left:auto;text-align:right}
.boss-hp .big{font-family:var(--f-num);font-weight:600;font-size:26px}
.boss-hp .big span{color:var(--muted);font-size:15px}
.hpbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 18px 10px}
.seg{height:26px;border-radius:4px;background:var(--boss-track);position:relative;overflow:hidden}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--boss);transition:width .6s ease}
.boss-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 18px 14px;border-top:1px solid var(--line);background:var(--sunk);font-size:13px;color:var(--muted)}
.boss-foot .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.boss.defeated .seg i{background:var(--muted)}
.boss .victory{color:var(--ok);font-weight:700}
.boss-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end;padding:12px 18px;border-top:1px solid var(--line)}
@media (max-width:720px){.boss-form{grid-template-columns:1fr 1fr}.boss-hp{margin-left:0;text-align:left}}

/* Sub nav */
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.subnav button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.subnav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}

/* Generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.boss-btn{background:var(--boss);border-color:var(--boss);color:#fff}
.btn.danger{color:var(--soldier);border-color:var(--soldier)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;min-width:0}
textarea.in{min-height:170px;font-family:var(--f-num);font-size:12.5px;line-height:1.5;resize:vertical}
.muted{color:var(--muted)}
.h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 12px;max-width:68ch}

/* Board */
.board-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.board-tools .in{max-width:260px}
.week{font-size:13px;color:var(--muted);margin-left:auto}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1180px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);font-weight:700;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable:hover td{background:var(--sunk);cursor:pointer}
.rank{font-family:var(--f-num);color:var(--muted);width:36px}
.top3 .rank{color:var(--gold);font-weight:600}
.name{font-weight:700}
.guard{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid #7CFF9A;color:#7CFF9A;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px;background:rgba(124,255,154,.08)}
.xpbar i .dg{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,#1FA84F,#7CFF9A);box-shadow:0 0 10px rgba(124,255,154,.55);text-decoration:none}
.dgt{color:#3BD16F}
.bt.voidarena{background:linear-gradient(rgba(6,0,10,.35),rgba(6,0,10,.7)),var(--void) center/cover no-repeat}
.bt.voidarena .bt-floor{opacity:.35}
.cn-dark{position:absolute;inset:0;background:#05000a;opacity:0;transition:opacity 1.4s;pointer-events:none}
.cn-sp{position:absolute}.cn-breath{animation:cnbreath 3s ease-in-out infinite;transform-origin:50% 100%}
.cn-tremble{animation:cntrem .12s linear infinite}@keyframes cntrem{50%{translate:3px -2px}}
.cn-px{position:absolute;width:.7%;aspect-ratio:1;pointer-events:none}
.cn-eraseline{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:#FF2A45;box-shadow:0 0 20px #FF2A45,0 0 50px #FF0030;pointer-events:none;z-index:2}
.cn-holy{position:absolute;left:30%;top:10%;width:40%;height:80%;background:radial-gradient(ellipse at center,rgba(255,227,138,.75),transparent 65%);mix-blend-mode:screen;animation:cnglow 2.4s ease-in-out infinite;pointer-events:none}
.cn-glowred{filter:drop-shadow(0 0 18px #FF2A45) drop-shadow(0 0 40px #FF0030)}
.bt.ph2 .bt-boss,.bt.ph3 .bt-boss{transform:scale(1.15);transform-origin:50% 90%}.bt.ph3 .bt-boss{transform:scale(1.28)}
.bt.ph2 .bt-bimg{filter:drop-shadow(0 0 16px rgba(255,40,70,.75)) drop-shadow(0 0 40px rgba(255,0,40,.45))}.bt.ph3 .bt-bimg{filter:drop-shadow(0 0 20px rgba(255,20,60,.95)) drop-shadow(0 0 60px rgba(180,0,40,.7))}
.bt.ph2,.bt.ph3{background:radial-gradient(ellipse at 70% 40%,#3a0a1c 0%,#16051a 55%,#07020a 100%)}
.bt-boss.grow .bt-bimg{animation:pgrow .8s cubic-bezier(.2,1.6,.4,1)}@keyframes pgrow{from{transform:scale(.7)}}
.bt-boss.guard .bt-bimg{filter:drop-shadow(0 0 10px #9AD8FF) drop-shadow(0 0 26px #5AA8FF) brightness(1.1)}
.bt-h.final{z-index:4}.bt-h.final img{filter:drop-shadow(0 0 12px #FFE38A) drop-shadow(0 0 28px #FFC24A);animation:finpulse .5s ease-in-out infinite}
@keyframes finpulse{50%{transform:scale(1.08)}}
.bt.slowmo .bt-shot{animation-duration:1.4s!important}
.rest{display:flex;gap:18px;align-items:center;margin-top:14px}.rest-ft img{width:clamp(90px,12vw,150px);image-rendering:auto;filter:drop-shadow(0 0 14px rgba(61,224,255,.35))}
.rest-tx p{margin:4px 0 8px;font-size:14px}.rest-slots{display:flex;align-items:center;gap:6px}.rest-slots img{width:34px;opacity:.22;filter:grayscale(1)}.rest-slots img.on{opacity:1;filter:drop-shadow(0 0 8px #3DE0FF)}.rest-slots span{font-family:var(--f-num);font-size:13px;margin-left:6px}
.rest-ready{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;border:2px solid #3DE0FF;border-radius:10px;background:rgba(61,224,255,.08)}.rest-ready img{width:52px}.rest-ready b{display:block;color:#9FEFFF}.rest-ready span{font-size:13px}
.cine{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center;opacity:0;transition:opacity .8s}.cine.in{opacity:1}
.cn-stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#000;cursor:pointer}
.cn-cam{position:absolute;inset:0;transform-origin:50% 55%}
.cn-l{position:absolute;inset:-6%;will-change:transform}.cn-l img{position:absolute}
.cn-bg{left:0;top:0;width:100%;height:100%;object-fit:cover;position:absolute}.cn-broken{opacity:0;transition:opacity .25s}.cine.broken .cn-broken{opacity:1}
.cn-books img{animation:cnfloat 5s ease-in-out infinite}@keyframes cnfloat{50%{transform:translateY(-14%) rotate(4deg)}}
.cine.rumble .cn-books img{animation:cnwob .2s linear infinite}@keyframes cnwob{50%{transform:translate(3%,2%) rotate(-6deg)}}
.cn-ft{left:41.5%;top:47%;width:17%;transition:filter .5s}
.cn-glow{position:absolute;left:41%;top:44%;width:18%;height:22%;border-radius:50%;background:radial-gradient(rgba(61,224,255,.55),transparent 65%);animation:cnglow 2.4s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen;transition:opacity 1s}
.cn-glow.dim{opacity:.4}.cn-glow.off{opacity:0}.cn-glow.gold{opacity:1;background:radial-gradient(rgba(255,200,80,.6),transparent 65%)}
@keyframes cnglow{50%{transform:scale(1.12);opacity:.8}}
.cn-owl{left:60%;top:52%;width:11%;animation:cnbreath 3s ease-in-out infinite;transform-origin:50% 100%}@keyframes cnbreath{50%{transform:scaleY(1.025)}}
.cn-boss{left:5%;top:30%;width:24%;opacity:0;transform:scale(.6);filter:drop-shadow(0 0 24px rgba(255,30,60,.7));transition:left 2.2s ease-in-out,top 2.2s ease-in-out,transform .5s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.cn-boss.enter{opacity:1;transform:scale(1)}.cn-boss.walk{left:21%;top:36%}.cn-boss.leave{opacity:0;transform:scale(.4) translateY(-30%);transition:all 1.2s ease-in}
.cn-fx img{position:absolute}.cn-front img{position:absolute}
.cn-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.cine.hit .cn-vig,.cine.broken .cn-vig{background:radial-gradient(ellipse at center,transparent 50%,rgba(80,0,20,.55) 100%)}
.cn-flash{position:absolute;inset:0;pointer-events:none;opacity:0}.cn-flash.on{animation:cnfl .6s ease-out}@keyframes cnfl{from{opacity:1}to{opacity:0}}
.cn-title{position:absolute;left:0;right:0;top:12%;text-align:center;pointer-events:none;opacity:0;transform:scale(1.3);transition:all .4s cubic-bezier(.2,1.5,.4,1)}.cn-title.on{opacity:1;transform:none}
.cn-title small{display:block;font-family:var(--f-num);letter-spacing:.2em;text-transform:uppercase;color:#FFB3C0;font-size:clamp(11px,1.4vw,16px)}.cn-title b{font-family:"Press Start 2P",var(--f-display);font-size:clamp(26px,5.5vw,64px);color:#FF3D5A;text-shadow:0 0 24px #FF0030,0 5px 0 #000}
.cn-box{position:absolute;left:3%;right:3%;bottom:4%;display:flex;gap:2%;align-items:center;background:rgba(8,6,20,.9);border:4px solid var(--c);border-radius:16px;padding:1.6% 2.4%;box-shadow:0 0 0 4px #000,0 0 30px var(--c);min-height:26%}
.cn-por{width:clamp(80px,15%,200px);aspect-ratio:1;object-fit:contain;flex:none}
.cn-txt{flex:1}.cn-who{display:block;font-family:"Press Start 2P",var(--f-display);font-size:clamp(12px,1.6vw,20px);color:var(--c);margin-bottom:.6em}
.cn-say{margin:0;color:#fff;font-family:var(--f-body);font-weight:700;font-size:clamp(16px,2.5vw,32px);line-height:1.35;min-height:2.7em}
.cn-next{display:block;text-align:right;color:var(--muted);font-family:var(--f-num);font-size:clamp(10px,1.1vw,13px);animation:cnblink 1.2s steps(2) infinite}@keyframes cnblink{50%{opacity:.2}}
.cn-skip{position:absolute;right:1.5%;top:2%;z-index:3}
.cn-item{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;animation:cardin .5s cubic-bezier(.2,1.6,.4,1)}.cn-item img{position:static;width:clamp(90px,13vw,190px);filter:drop-shadow(0 0 20px #3DE0FF)}.cn-item span{font-family:"Press Start 2P",var(--f-display);font-size:clamp(12px,1.6vw,20px);color:#9FEFFF;text-shadow:0 3px 0 #000;margin-top:6px}
.cn-end{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.cn-rule{display:flex;align-items:center;gap:clamp(6px,1.4vw,18px);margin:12px 0;flex-wrap:wrap;justify-content:center}.cn-rule>div{display:flex;flex-direction:column;align-items:center;gap:4px}.cn-rule>div{flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:150px}.cn-rule img{width:clamp(34px,5vw,64px)!important;height:auto!important}.cn-rule span{flex-basis:100%;text-align:center;font-size:13px!important;margin:0!important}.cn-rule>b{font-size:22px!important}
@media (prefers-reduced-motion:reduce){.cn-books img,.cn-glow,.cn-owl,.cn-next{animation:none}}
.pwcl{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border:1px solid var(--medic);color:var(--medic);border-radius:6px;padding:2px 6px;background:rgba(59,209,111,.1)}.pwcl.used{opacity:.4;text-decoration:line-through}
.dclr{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(2,10,6,.6);animation:btin .25s ease-out}
.dclr-card{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(5,14,10,.94);border:3px solid var(--medic);border-radius:14px;padding:20px 34px;box-shadow:0 0 0 3px #000,0 0 40px rgba(59,209,111,.6);min-width:min(320px,86vw);text-align:center}
.dclr-card small{font-family:var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:#9fe8b8;font-size:12px}
.dclr-h{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 10px var(--medic))}
.dclr-n{font-family:"Press Start 2P",var(--f-display);font-size:clamp(18px,3vw,26px);color:#fff}
.dclr-s{color:#cfeedd;font-size:15px}
.dclr.done .dclr-h{animation:mrd2 .8s ease-in-out infinite}.dclr.done .dclr-n{color:#7CFF9A;text-shadow:0 0 14px #7CFF9A}
@keyframes mrd2{50%{transform:translateY(-8px) scale(1.06)}}
.dwarn{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(40,0,8,.55);pointer-events:none;animation:dwb .55s steps(2) infinite}
.dwarn b{font-family:"Press Start 2P",var(--f-display);font-size:clamp(26px,6vw,64px);color:#FF3D5A;text-shadow:0 0 20px #FF0030,0 4px 0 #000}
.dwarn span{font-family:var(--f-num);letter-spacing:.3em;color:#FFB3C0;font-size:clamp(12px,1.6vw,18px)}
.dstart{pointer-events:auto;margin:14px 0 4px;font-family:"Press Start 2P",var(--f-display);font-size:clamp(16px,2.6vw,26px);color:#1a0b00;background:linear-gradient(180deg,#FFE680,#FFB800);border:4px solid #000;border-radius:12px;padding:20px 34px;cursor:pointer;box-shadow:0 6px 0 #8a5a00,0 0 0 3px #FFE680,0 0 40px rgba(255,200,0,.8);animation:dsb 1.1s ease-in-out infinite}
.dstart:hover{filter:brightness(1.08)}.dstart:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5a00,0 0 0 3px #FFE680,0 0 40px rgba(255,200,0,.8)}
.dstart:focus-visible{outline:4px solid #fff;outline-offset:4px}
@keyframes dsb{50%{transform:scale(1.05)}}
.bt.shadow .bt-boss .bt-bimg{filter:brightness(0) drop-shadow(0 0 16px rgba(255,61,110,.95)) drop-shadow(0 0 40px rgba(255,0,40,.6))!important}
.dw-s{width:100%;height:34px;background:repeating-linear-gradient(-45deg,#FF2A45 0 26px,#1a0006 26px 52px);box-shadow:0 0 24px #FF0030}
@keyframes dwb{50%{background:rgba(90,0,16,.65)}}
.dduel{position:absolute;left:50%;top:110px;transform:translateX(-50%);width:min(760px,86vw);z-index:4;text-align:center}
.dd-lab{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:12px;letter-spacing:.14em;color:#ffd0d8;margin-bottom:4px}.dd-lab span:first-child{color:#7CFF9A}
.dd-bar{position:relative;height:30px;border:3px solid #000;border-radius:6px;box-shadow:0 0 0 2px #fff3,0 0 26px rgba(255,40,70,.5);background:#200;overflow:visible;display:flex}
.dd-g{display:block;height:100%;background:linear-gradient(180deg,#9DFFB4,#1FA84F);box-shadow:0 0 18px #7CFF9A}
.dd-r{display:block;height:100%;background:linear-gradient(180deg,#FF7A8C,#B0001E);box-shadow:0 0 18px #FF3D5A}
.dd-edge{position:absolute;top:-8px;bottom:-8px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 16px #fff,0 0 30px #ff0}

.dpiece{position:absolute;width:30px;height:34px;margin:-17px 0 0 -15px;background:url(assets/wd-piece.webp) center/contain no-repeat;image-rendering:pixelated;filter:drop-shadow(0 0 6px #7CFF9A);opacity:.95}
.dshell.flash .dpiece{animation:pfl .5s ease-out 2}@keyframes pfl{50%{filter:brightness(2.2) drop-shadow(0 0 12px #fff)}}
.dshell.crack .dpiece{opacity:.55}

.dshell.crack2 .dpiece{filter:brightness(.7) hue-rotate(-40deg);opacity:.7}.dshell.crack2 .dpiece:nth-child(2n){opacity:.2}

.dsay::after{content:"";position:absolute;left:30px;bottom:-14px;border:8px solid transparent;border-top:10px solid #000}
.dstrike{position:absolute;right:6%;top:24%;z-index:6;font-family:"Press Start 2P",var(--f-display);font-size:clamp(14px,2vw,22px);color:#FFD0D8;text-shadow:0 0 14px #FF2040,0 3px 0 #000;animation:cardin .3s ease-out;pointer-events:none}
.dshell.break .dpiece{animation:pbr 1s ease-in forwards}@keyframes pbr{to{transform:translateY(160px) rotate(220deg);opacity:0}}
.dcount{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:9;font-family:"Press Start 2P",var(--f-display);font-size:clamp(80px,16vw,200px);color:#fff;text-shadow:0 0 30px #FF2040,0 8px 0 #000;animation:dcn .8s ease-out both;pointer-events:none}
@keyframes dcn{from{transform:translate(-50%,-50%) scale(2.2);opacity:0}30%{opacity:1}to{transform:translate(-50%,-50%) scale(.9);opacity:.2}}
.bt-h.guard{transform:translateY(-10px) scale(1.12);z-index:2}.bt-h.guard img{filter:drop-shadow(0 0 10px #7CFF9A) drop-shadow(0 0 22px #7CFF9A)}
.bt-h.guard::after{content:"";position:absolute;right:-18%;top:28%;width:52%;height:46%;background:url(assets/wd-guard.webp) center/contain no-repeat;filter:drop-shadow(0 0 8px #7CFF9A);z-index:3}
.bt-h.deb img{filter:drop-shadow(0 0 8px #C58BFF) grayscale(.5) hue-rotate(220deg) brightness(.85)}
.bt-h.deb::before{content:"";position:absolute;inset:22% -2% 14%;z-index:3;pointer-events:none;background:url(assets/wd-chains.webp) center/contain no-repeat;filter:drop-shadow(0 0 6px #C58BFF);animation:chain .35s ease-out both}
@keyframes chain{from{opacity:0;transform:scale(1.4)}}
.bt-h.medready::before{content:"";position:absolute;top:-30px;left:50%;width:34px;height:32px;transform:translateX(-50%);background:url(assets/wd-cross.webp) center/contain no-repeat;z-index:4;animation:mrd 1.1s ease-in-out infinite;inset:auto auto auto 50%}
@keyframes mrd{50%{transform:translateX(-50%) translateY(-5px) scale(1.1)}}
.ddome{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:fill;opacity:0;pointer-events:none;transition:opacity .5s;mix-blend-mode:screen;image-rendering:pixelated}
.dshell.mid .ddome{opacity:.35}.dshell.full .ddome{opacity:.55}.dshell.weak .ddome{opacity:.18}
.dslash{position:absolute;z-index:7;width:min(34vw,380px);pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 0 16px #FF2040);animation:dsl .55s ease-out forwards}
@keyframes dsl{from{opacity:0;transform:translate(-30%,-70%) scale(.6) rotate(-10deg)}30%{opacity:1}to{opacity:0;transform:translate(-60%,-40%) scale(1.15) rotate(4deg)}}
.dbreak{position:absolute;left:50%;bottom:0;width:110%;transform:translateX(-50%);pointer-events:none;z-index:4;animation:dbk 1.1s ease-out forwards}
@keyframes dbk{from{opacity:1;transform:translateX(-50%) scale(.9)}to{opacity:0;transform:translateX(-50%) translateY(60px) scale(1.25)}}
.bt-h.medready img{filter:drop-shadow(0 0 10px var(--medic)) drop-shadow(0 0 20px var(--medic))}
.bt-card.dmot{max-width:min(640px,88vw)}.bt-card.dmot p{font-family:var(--f-body);font-size:clamp(17px,2.2vw,23px);color:#fff;margin:10px 0 0;line-height:1.35}
@media (prefers-reduced-motion:reduce){.dwarn,.bt-boss.charging .bt-bimg,.dstart{animation:none}}
.dshield{position:absolute;left:1%;bottom:5%;width:50%;height:56%;border-radius:50%;border:4px solid #7CFF9A;box-shadow:0 0 40px #7CFF9A,inset 0 0 50px rgba(124,255,154,.45);background:radial-gradient(rgba(124,255,154,.18),transparent 70%);animation:dsh .45s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none;z-index:5}
@keyframes dsh{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.dflash{position:absolute;inset:0;background:radial-gradient(rgba(255,40,60,.6),rgba(255,0,40,.25));animation:dfl .7s ease-out both;pointer-events:none;z-index:5}
@keyframes dfl{from{opacity:1}to{opacity:0}}
.bt-h.hurt img{filter:drop-shadow(0 0 8px #FF3D6E) sepia(1) hue-rotate(-50deg) saturate(5) brightness(1.1)}
.bt-team.many .bt-h{width:clamp(40px,4.6vw,66px)}
.bt-card .dpct{font-family:"Press Start 2P",var(--f-display);font-size:clamp(34px,7vw,72px);color:var(--c,#fff);display:block;margin-top:8px}
.dgg{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;margin-top:12px;max-width:min(860px,88vw)}
.dgg div{display:flex;flex-direction:column;align-items:center;width:84px}
.dgg img{width:60px;image-rendering:pixelated;filter:drop-shadow(0 0 8px #7CFF9A)}
.dgg span{font-family:var(--f-num);font-size:12px;margin:2px 0 0;color:#fff}
.dgg em{font-style:normal;font-family:var(--f-num);font-size:12px;color:#7CFF9A}
.dband{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:10px 0 0}
.dband b{white-space:nowrap}
.dres{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.dres h4{margin:0 0 6px;font-size:16px}
.dbig{font-family:var(--f-num);font-size:28px;font-weight:700}
.vet{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.chip.Medic{background:var(--medic-soft);color:var(--medic)}
.chip.Soldier{background:var(--soldier-soft);color:var(--soldier)}
.chip.Engineer{background:var(--engineer-soft);color:var(--engineer)}
.chip.none{border-color:var(--line);color:var(--muted)}
.lvl{display:flex;flex-direction:column;gap:4px;min-width:170px}
.lvl-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.lvl-top b{font-family:var(--f-display);font-size:14px}
.xpbar{height:7px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.lvl small{font-size:11px;color:var(--muted)}
.qz{display:flex;gap:8px;font-family:var(--f-num);font-size:13px;white-space:nowrap}
.qz .p{color:var(--ok)} .qz .f{color:var(--warn)}
.coin{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:600}
.coin::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-soft)}
.pw{display:flex;gap:6px;flex-wrap:wrap}
.pwbtn{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pwbtn.Medic{border-color:var(--medic);color:var(--medic)}
.pwbtn.Engineer{border-color:var(--engineer);color:var(--engineer)}
.pwbtn[aria-pressed="true"]{border-style:solid;text-decoration:line-through;opacity:.6}
.pw .lock{font-size:12px;color:var(--muted)}

/* Empty */
.empty{text-align:center;padding:40px 16px;border:2px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty h2{font-family:var(--f-display);margin:0 0 6px;font-size:22px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:52ch}

/* Import preview */
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-num)}
.unm{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--sunk)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

/* Roster */
.rlist{display:flex;flex-direction:column}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) 150px 110px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
@media (max-width:640px){.ritem{grid-template-columns:1fr 1fr}.ritem .nm{grid-column:1/-1}}

/* Log */
.log h4{font-family:var(--f-display);margin:14px 0 6px;font-size:15px}
.log table{min-width:560px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.1}
.dsec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.dsec h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.brk span:nth-child(even){font-family:var(--f-num);text-align:right}
.brk .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}
.qlist{font-size:13px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.qlist table{min-width:0}
.qlist td,.qlist th{padding:6px 8px}
.x{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);border:0;background:transparent;font-size:26px;line-height:1;color:var(--muted)}
.lockline{font-size:13px;color:var(--warn);font-weight:700}

/* Projector */
body.proj .subnav,body.proj .stats,body.proj .board-tools .in,body.proj .boss-foot .sp,body.proj .notice{display:none}
body.proj td{font-size:18px;padding:12px 14px}
body.proj .boss-name{font-size:44px}
body.proj .seg{height:40px}
body.proj .pwbtn{pointer-events:none}

/* ═════════ Game skin ═════════ */
body{background:radial-gradient(1200px 600px at 70% -10%,rgba(80,60,200,.35),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(255,61,203,.12),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#cfe,transparent),radial-gradient(1.5px 1.5px at 38% 62%,#fff,transparent),radial-gradient(1px 1px at 86% 48%,#fff,transparent),radial-gradient(1px 1px at 22% 84%,#bdf,transparent),radial-gradient(1.5px 1.5px at 58% 32%,#fff,transparent),radial-gradient(1px 1px at 94% 88%,#fff,transparent),radial-gradient(1px 1px at 6% 52%,#fff,transparent);
  background-size:420px 420px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:.7}}
.top{background:linear-gradient(180deg,rgba(11,17,48,.96),rgba(11,17,48,.85));backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,194,74,.35);box-shadow:0 4px 24px rgba(0,0,0,.5)}
.brand b{background:linear-gradient(90deg,#fff,#FFC24A);-webkit-background-clip:text;background-clip:text;color:transparent}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#FFD877,#E9A21F);color:#1a1200;box-shadow:0 0 14px rgba(255,194,74,.45)}
.stat,.panel,.tablebox,.boss,.empty,.notice{background:linear-gradient(180deg,rgba(26,36,74,.82),rgba(14,20,44,.86));border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(6px)}
.notice.warn{background:linear-gradient(180deg,rgba(70,52,16,.85),rgba(40,30,10,.85));border-color:rgba(255,179,71,.5)}
.stat{position:relative;border-radius:6px;padding:12px 16px;
  background-image:linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(180deg,rgba(26,36,74,.82),rgba(14,20,44,.86));
  background-size:14px 2px,2px 14px,14px 2px,2px 14px,auto;background-position:0 0,0 0,100% 100%,100% 100%,0 0;background-repeat:no-repeat}
.stat .k{color:var(--cy);opacity:.85}
.stat .v{font-size:26px;text-shadow:0 0 12px rgba(61,224,255,.25)}
.subnav{border-bottom:1px solid var(--line)}
.subnav button{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.subnav button[aria-selected="true"]{color:var(--gold);text-shadow:0 0 10px rgba(255,194,74,.5)}
.btn{background:rgba(255,255,255,.04);border-color:var(--line)}
.btn.primary{background:linear-gradient(180deg,#FFD877,#E9A21F);border-color:#E9A21F;color:#1a1200;box-shadow:0 0 12px rgba(255,194,74,.3)}
.btn.boss-btn{background:linear-gradient(180deg,#FF6E93,#E0204F);border-color:#E0204F;box-shadow:0 0 14px rgba(255,61,110,.45)}
input.in,select.in,textarea.in{background:rgba(5,9,24,.7)}
th{background:rgba(5,9,24,.55);color:var(--cy)}
tbody tr.clickable:hover td{background:rgba(61,224,255,.06)}
.rank{width:48px}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--f-display);font-weight:700;font-size:14px;color:#1a1200}
.m1{background:radial-gradient(circle at 35% 30%,#FFF1B8,#FFC24A 55%,#B97C10);box-shadow:0 0 12px rgba(255,194,74,.6)}
.m2{background:radial-gradient(circle at 35% 30%,#fff,#C8D3E6 55%,#7D8BA6);box-shadow:0 0 10px rgba(200,211,230,.4)}
.m3{background:radial-gradient(circle at 35% 30%,#FFD9B0,#D58A4A 55%,#8A4E1E);box-shadow:0 0 10px rgba(213,138,74,.4)}
.xpbar{height:9px;background:rgba(5,9,24,.8);border-color:rgba(255,194,74,.25);position:relative}
.xpbar i{background:linear-gradient(90deg,#E9A21F,#FFE08A);box-shadow:0 0 10px rgba(255,194,74,.6);position:relative;overflow:hidden}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.drawer{background:linear-gradient(180deg,#141d3e,#0b1129);border-left:1px solid rgba(255,194,74,.3)}
.empty{border-style:dashed}

/* Boss arena */
.boss.arena{position:relative;border-radius:10px;border-color:rgba(255,61,110,.35);overflow:hidden;
  background:radial-gradient(60% 70% at 50% 45%,rgba(255,61,203,.22),transparent 70%),linear-gradient(180deg,rgba(7,10,28,.78),rgba(7,10,28,.95)),url("assets/banner.webp") center 30%/cover no-repeat}
.arena-floor{position:absolute;left:-20%;right:-20%;bottom:0;height:46%;pointer-events:none;opacity:.55;
  background:repeating-linear-gradient(90deg,rgba(61,224,255,.35) 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,rgba(61,224,255,.35) 0 1px,transparent 1px 34px);
  transform:perspective(320px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent)}
.arena-top{position:relative;text-align:center;padding:18px 18px 0}
.arena .boss-tag{color:#FF8FB0;text-shadow:0 0 10px rgba(255,61,110,.6)}
.arena .boss-name{font-size:clamp(30px,6vw,46px);color:#fff;letter-spacing:.12em;text-shadow:0 0 18px rgba(255,61,203,.7),0 3px 0 #5a0f3a}
.arena-stage{position:relative;--s:clamp(190px,30vw,270px);height:calc(var(--s) + 10px);display:flex;justify-content:center;align-items:flex-end}
.sprite{position:relative;width:var(--s);height:var(--s);isolation:isolate}
.sprite .glitch{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;animation:glitch 6s steps(1) infinite}
.sprite .body{position:absolute;inset:0;transform-origin:50% 96%;animation:breathe 3.4s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,61,203,.45)) drop-shadow(0 0 30px rgba(61,224,255,.25))}
.sprite .body img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;pointer-events:none}
.sprite[data-f="idle"] .f-idle,.sprite[data-f="blink"] .f-blink,.sprite[data-f="roar"] .f-roar,.sprite[data-f="hurt"] .f-hurt,.sprite[data-f="ko"] .f-ko,.sprite[data-f="down"] .f-down{opacity:1}
.sprite{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sprite.roaring .glitch{animation:roarshake .12s linear 7}
.sprite.roaring .aura{background:radial-gradient(closest-side,rgba(255,61,110,.55),transparent)}
.sprite.hurting .glitch{animation:knock .55s ease-out}
.sprite.hurting .body{filter:brightness(1.45) drop-shadow(0 0 20px #fff)}
@keyframes roarshake{0%{transform:translate(0,0) scale(1.04)}25%{transform:translate(-4px,2px) scale(1.06)}50%{transform:translate(4px,-2px) scale(1.06)}75%{transform:translate(-3px,-1px) scale(1.05)}100%{transform:translate(0,0) scale(1.04)}}
@keyframes knock{0%{transform:none}20%{transform:translate(14px,2px) rotate(4deg)}55%{transform:translate(-5px,0) rotate(-1.5deg)}100%{transform:none}}
.dmgpop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-num);font-weight:700;font-size:clamp(22px,4vw,34px);color:#fff;text-shadow:0 0 10px #FF3D6E,0 2px 0 #7a0f33;pointer-events:none;animation:pop 1.3s ease-out forwards;white-space:nowrap;z-index:3}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.sparks{position:absolute;inset:0;pointer-events:none;z-index:2}
.sparks i{position:absolute;width:6px;height:6px;background:var(--c,#3DE0FF);box-shadow:0 0 6px var(--c,#3DE0FF);animation:spark 2.6s linear infinite;opacity:0}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-120px)}}
.sprite .shadow{position:absolute;bottom:2%;left:50%;width:62%;height:9%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);animation:shadow 3.4s ease-in-out infinite;z-index:-1}

  background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 55%,color-mix(in srgb,var(--pc) 55%,#000));clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);filter:drop-shadow(0 0 6px var(--pc))}

.paura{position:absolute;left:50%;bottom:4%;width:150%;aspect-ratio:1;transform:translateX(-50%);z-index:-1;pointer-events:none;border-radius:50%;

.paura.bright{background:radial-gradient(closest-side,color-mix(in srgb,var(--pc) 80%,transparent),transparent 70%),conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--pc) 35%,transparent),transparent 30%,color-mix(in srgb,var(--pc) 35%,transparent),transparent 60%);}

@keyframes pfloat{50%{transform:translateY(-3%) scale(1.04);opacity:.85}}

.paura:has(img){background:none}.paura:has(img)::after{display:none}

@keyframes paura{50%{transform:translateX(-50%) scale(1.08);opacity:.85}}
@keyframes pspin{to{transform:rotate(360deg)}}

/* ═════════ THE CHRONICLES · LITE ═════════

  {k:"papercuts",name:"Papercut Mites",mini:true,sentBy:"Pagebreaker",story:"Tiny paper bugs that crawled out of the golem's pages."},

  {k:"hexlings",name:"Hexlings",mini:true,sentBy:"Hex",story:"Little curse-spirits Hex left behind."},
  {k:"mirrorlock",name:"Mirrorlock",sentBy:"NULL",story:"A haunted mirror that turns every word backwards."},

  {k:"inkimps",name:"Inkblot Imps",mini:true,sentBy:"Inkrot Hydra",story:"Drips of rotten ink that came alive."},
  {k:"gobble",name:"Lord Gobble",sentBy:"NULL",story:"A greedy candy king who eats stories like sweets."},

function hashIdx(s,n){ let k=0; for(const ch of String(s)) k=(k*31+ch.charCodeAt(0))>>>0; return k%n; }

function matcher(students){

  const PART=new Set(["DE","LA","DEL","LOS","LAS","Y","DA","DOS","VAN","VON"]);
  const words=students.map(s=>({id:s.id,w:new Set(norm(s.name).split(" ").filter(x=>!PART.has(x)))}));
  const cache=new Map();
  return raw=>{ const n=norm(raw); if(cache.has(n)) return cache.get(n);
    let id=byNorm.get(n)||null;
    if(!id){ const rw=new Set(n.split(" ").filter(x=>!PART.has(x))); let best=null,score=0,tie=false;
      for(const s of words){ let k=0; for(const w of rw) if(s.w.has(w)) k++; if(k>score){score=k;best=s.id;tie=false;} else if(k===score&&k>0) tie=true; }
      if(score>=2&&!tie) id=best; }

// a student's Lexile: the median of the books from their last 6 quizzes

function splitLine(line,delim){ const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===delim){ out.push(cur); cur=""; } else cur+=ch; }

  const missing=Object.entries(ix).filter(([k,v])=>v<0).map(([k])=>({name:"Student Name",quiz:"Quiz Name",score:"Quiz Score",date:"Quiz Date",words:"Words Read"}[k]));

function guiaHTML(){
